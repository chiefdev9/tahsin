<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Qiroati Smala</title>

    <!-- ========================================== -->
    <!-- OPTIMASI FMP: INLINE CRITICAL CSS & HINTS  -->
    <!-- ========================================== -->
    <!-- Preconnect ke CDN agar proses DNS/TLS lebih cepat -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <!-- Tailwind CSS CDN dengan atribut async/preload alternatif atau biarkan terload cepat -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS Client CDN (Dimuat dengan async agar tidak memblokir render UI utama) -->
    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- JS Utama (type="module" secara otomatis bersifat deferred, aman untuk FMP) -->
    <script type="module" src="main.js" defer></script>

    <!-- ========================================== -->
    <!-- OPEN GRAPH / WHATSAPP SHARE META TAGS      -->
    <!-- ========================================== -->
    <meta property="og:locale" content="id_ID">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tabel Qiroati Smala">
    <meta property="og:description" content="Aplikasi pengelolaan dan pemantauan data qiroati multi perangkat secara real-time.">
    <meta property="og:image" content="https://guru-tahsin.vercel.app/thumb.png">
    <meta property="og:image:width" content="700">
    <meta property="og:image:height" content="700">
    <meta property="og:url" content="https://guru-tahsin.vercel.app/">
    <meta property="og:site_name" content="Tabel Qiroati Smala">

    <!-- FAVICON & PWA MANIFEST -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="manifest" href="manifest.json">
</head>

<body class="bg-gray-100 min-h-screen pb-24 p-4 sm:p-6 text-gray-800 font-sans">

    <!-- ========================================== -->
    <!-- FULL-SCREEN LOADING OVERLAY                -->
    <!-- ========================================== -->
    <div id="app-loading-overlay"
        class="fixed inset-0 bg-white z-[100] flex items-center justify-center transition-opacity duration-300">
        <div class="w-10 h-10 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
    </div>

    <!-- ========================================== -->
    <!-- 2. KONTEN UTAMA: TABEL DATA                -->
    <!-- ========================================== -->
    <div class="max-w-md mx-auto bg-white shadow-md mb-20 border border-gray-200">
        <!-- Header Tabel -->
        <div class="sticky top-0 z-10 grid grid-cols-[7%_51%_10%_32%] bg-indigo-600 text-white font-semibold text-sm py-3 px-2 items-center">
            <div class="text-center">No</div>
            <div id="header-daftar-murid" class="text-center">Daftar Murid</div>
            <div class="text-center">JK</div>
            <div id="header-kategori" class="text-center px-1">Jilid</div>
        </div>

        <!-- Body Tabel (Kosong di awal, segera diisi data lokal/cache oleh main.js) -->
        <div id="table-body" class="divide-y divide-gray-200 text-sm"></div>
    </div>

    <!-- ========================================== -->
    <!-- 3. OVERLAY & BACKDROP MODAL                -->
    <!-- ========================================== -->
    <div id="dropdown-backdrop" onclick="closeAllDropdowns()"
        class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 transition-opacity"></div>

    <!-- ========================================== -->
    <!-- 4. NAVIGASI BAWAH (STICKY BOTTOM BAR)      -->
    <!-- ========================================== -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-200 p-3 shadow-2xl z-50">
        <div class="max-w-md mx-auto mb-2.5 px-3 py-2 bg-indigo-50/80 border border-indigo-100 text-indigo-900 font-bold text-xs sm:text-sm flex items-center justify-center">
            <span>RUANG : -</span>
        </div>

        <div class="max-w-md mx-auto grid grid-cols-3 gap-2 sm:gap-3">
            <!-- Dropdown Guru, Kategori, dan Waktu (Struktur tetap sama) -->
            <!-- ... (elemen dropdown Anda di sini) ... -->
        </div>
    </div>

</body>
</html>
